<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>BPM Export Portal</title>
    <link rel="stylesheet" href="styling.css" />
    <script src="app.js" defer></script>
</head>
    <body>

        <h1>BPM Export Portal</h1>
        <p>This site lets you download your exported heart rate CSV data.</p>

        <section>
            <h2>Export all data</h2>
            <p>Download a CSV containing every recorded sample.</p>
            <button id="downloadAllBtn">Download full CSV</button>
        </section>

        <section>
            <h2>Export a date range</h2>
            <p>Select a time range and download just those samples.</p>
            <form id="rangeForm">
                <label>
                    From:
                    <input type="datetime-local" id="fromInput" required>
                </label>
                <label>
                    To:
                    <input type="datetime-local" id="toInput" required>
                </label>
                <button type="submit">Download CSV for range</button>
            </form>
        </section>

        <p id="errorMessage" class="hidden"></p>

    </body>
</html>
