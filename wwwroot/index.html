<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>BPM Export Portal</title>
    <link rel="stylesheet" href="styling.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="app.js"></script>
</head>
    <body>

        <h1>BPM Export Portal</h1>
        <button id="testUploadBtn">Upload test CSV (simulate watch)</button>
        <p>This site will allow you to download your exported heart rate CSV files.</p>

        <h2>Upload a file</h2>

        <input type="file" id="csvUploadInput" accept=".csv">
        <button id="uploadCsvFileBtn">Upload CSV File</button>

        <h2>Your Exports</h2>

        <p id="statusText">Checking for exported data…</p>

        <button id="downloadAllBtn" disabled>Download full CSV</button>

        <h2>Latest BPM data</h2>
        <p id="graphStatus">No data received yet.</p>
        <canvas id="bpmChart" width="600" height="300"></canvas>

        <p id="selectedRangeText">
            No range selected. Click and drag on the chart to select a range to download.
        </p>

        <button id="downloadSelectedBtn" disabled>Download selected range</button>

        <h2>Export a date range</h2>

        <form id="rangeForm">
            <label>
                From:
                <input type="datetime-local" id="fromInput" required />
            </label>
            <label>
                To:
                <input type="datetime-local" id="toInput" required />
            </label>
            <button type="submit">Download CSV for range</button>
        </form>

        <p id="errorMessage" class="hidden"></p>

    </body>
</html>
